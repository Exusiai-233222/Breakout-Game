<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0918" />
    <title>登录 · 拼图游戏</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧩%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">🧩</div>
        <div>
          <h1>拼图游戏</h1>
          <p>登录后挑战最快拼图，登上排行榜</p>
        </div>
      </div>

      <div class="card auth-card">
        <div class="tabs" role="tablist" aria-label="登录或注册">
          <button
            class="tab active"
            type="button"
            role="tab"
            aria-selected="true"
            data-tab="login"
          >
            登录
          </button>
          <button
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-tab="register"
          >
            注册
          </button>
        </div>

        <!-- 登录 -->
        <form id="loginForm" class="auth-form" novalidate>
          <div id="loginError" class="form-error" role="alert"></div>

          <div class="field">
            <label for="loginUsername">用户名</label>
            <input
              class="input"
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="请输入用户名"
            />
          </div>

          <div class="field">
            <label for="loginPassword">密码</label>
            <input
              class="input"
              id="loginPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
            />
          </div>

          <button class="btn btn-primary btn-block" id="loginSubmit" type="submit">
            登录
          </button>

          <p class="switch-line">
            还没有账号？
            <button class="link-btn" type="button" data-switch="register">立即注册</button>
          </p>
        </form>

        <!-- 注册 -->
        <form id="registerForm" class="auth-form hidden" novalidate>
          <div id="registerError" class="form-error" role="alert"></div>

          <div class="field">
            <label for="registerUsername">用户名</label>
            <input
              class="input"
              id="registerUsername"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="3~20 位中文、字母、数字或下划线"
            />
          </div>

          <div class="field">
            <label for="registerEmail">邮箱（选填）</label>
            <input
              class="input"
              id="registerEmail"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="example@mail.com"
            />
            <p class="hint">不填时将自动生成一个站内邮箱</p>
          </div>

          <div class="field">
            <label for="registerPassword">密码</label>
            <input
              class="input"
              id="registerPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="至少 6 位"
            />
          </div>

          <div class="field">
            <label for="registerPassword2">确认密码</label>
            <input
              class="input"
              id="registerPassword2"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="请再次输入密码"
            />
          </div>

          <button class="btn btn-primary btn-block" id="registerSubmit" type="submit">
            注册并进入游戏
          </button>

          <p class="switch-line">
            已有账号？
            <button class="link-btn" type="button" data-switch="login">返回登录</button>
          </p>
        </form>

        <ul class="feature-list">
          <li><span class="ico" aria-hidden="true">🎮</span>3×3 / 4×4 / 5×5 三种难度任选</li>
          <li><span class="ico" aria-hidden="true">⏱</span>实时计时与步数统计，记录每次成绩</li>
          <li><span class="ico" aria-hidden="true">🏆</span>查看本人排名与全站排行榜</li>
        </ul>
      </div>
    </div>

    <script type="module" src="js/auth-page.js"></script>
  </body>
</html>
