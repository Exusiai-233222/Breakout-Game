<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弹珠撞墙 · 弹珠游戏</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="game.html">
        <span class="brand-mark"></span>
        弹珠挑战
      </a>
      <nav class="nav">
        <a href="game.html" class="active">游戏</a>
        <a href="leaderboard.html">排行榜</a>
        <a href="profile.html">我的</a>
      </nav>
      <div class="user-chip">
        <span class="user-name" id="navUser"></span>
        <button class="btn btn-ghost btn-sm" id="authBtn" type="button">
          退出
        </button>
      </div>
    </header>

    <main class="page game-page">
      <!-- 游戏主区域 -->
      <section class="card stage">
        <div class="stage-head">
          <div class="stat">
            <span class="stat-label">关卡</span>
            <span class="stat-value" id="levelDisplay" style="color: #ffcc00"
              >1</span
            >
          </div>
          <div class="stat">
            <span class="stat-label">目标分</span>
            <span class="stat-value" id="targetDisplay" style="color: #ff4444"
              >50</span
            >
          </div>
          <div class="stat">
            <span class="stat-label">得分</span>
            <span class="stat-value" id="scoreDisplay">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">用时</span>
            <span class="stat-value" id="timer">00:00.0</span>
          </div>
        </div>

        <div
          id="game-container"
          style="
            position: relative;
            display: flex;
            justify-content: center;
            margin-top: 20px;
          "
        >
          <canvas
            id="gameCanvas"
            width="800"
            height="500"
            style="
              background: #0f0f1a;
              border-radius: 8px;
              cursor: none;
              max-width: 100%;
            "
          ></canvas>
        </div>

        <p
          class="status-text"
          id="status"
          style="text-align: center; margin-top: 15px"
        >
          正在加载游戏…
        </p>
      </section>

      <!-- 侧边栏：战绩 -->
      <aside class="side">
        <section class="card">
          <h2><span class="dot"></span>我的战绩</h2>
          <div class="record-list">
            <div class="record-line">
              <span>历史最高关卡</span>
              <strong id="bestLevel">-</strong>
            </div>
            <div class="record-line">
              <span>我的排名</span>
              <strong id="myRank">暂无成绩</strong>
            </div>
          </div>
        </section>
      </aside>
    </main>

    <!-- 接入页面控制器 -->
    <script type="module" src="js/game-page.js"></script>
  </body>
</html>
